<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thank You | Globe Financial</title>
<meta name="robots" content="noindex, nofollow">
<style>
@font-face{font-family:'Arcens Display';src:url('Arcens_Display.woff') format('woff');font-weight:700;font-display:swap}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;
  background:#333333;
  color:#fff;
  min-height:100vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:40px 24px;
  text-align:center;
}
.logo-wrap{margin-bottom:48px;text-decoration:none;display:block}
.logo-wrap img{
  width:260px;
  height:auto;
  object-fit:contain;
  display:block;
  margin:0 auto;
  filter:drop-shadow(0 8px 32px rgba(38,181,115,.3));
}
.icon{
  width:72px;height:72px;
  background:rgba(38,181,115,.12);
  border:2px solid rgba(38,181,115,.3);
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 28px;
}
h1{
  font-family:'Arcens Display',Arial,sans-serif;
  font-size:clamp(2rem,5vw,3rem);
  font-weight:700;
  margin-bottom:16px;
  color:#fff;
}
h1 span{color:#26b573}
p{
  color:rgba(255,255,255,.6);
  max-width:480px;
  margin:0 auto 40px;
  font-size:1.05rem;
  line-height:1.75;
}
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 32px;
  background:#26b573;color:#333333;
  border-radius:4px;
  font-family:Arial,sans-serif;
  font-size:14px;font-weight:700;
  text-decoration:none;
  text-transform:uppercase;
  letter-spacing:.06em;
  transition:all .3s ease;
}
.btn:hover{background:#1e9a5e;transform:translateY(-2px)}
@media(max-width:480px){.logo-wrap img{width:180px}}
</style>
</head>
<body>
<a href="/" class="logo-wrap">
  <img src="GlobeFinacial-Logo-Stacked-REV.png" alt="Globe Financial">
</a>
<div class="icon">
  <svg width="32" height="32" fill="none" stroke="#26b573" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
</div>
<h1>Message <span>Received.</span></h1>
<p>Thanks for reaching out. We will be in touch with you shortly and look forward to helping you achieve your financial goals.</p>
<a href="/" class="btn">
  <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  Back to Globe Financial
</a>
</body>
</html>
